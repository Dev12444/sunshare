# Every check the team runs locally, run again on a clean machine.
#
# The values below are placeholders on purpose. Nothing here talks to the real
# database or the real chain: the build only needs DATABASE_URL to be *shaped*
# like a Postgres URL for `prisma generate`, and the engine's tests are
# deterministic against SIM_SEED with the network switched off.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: web + contracts
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sunshare
      SESSION_SECRET: ci-only-not-a-secret
      NEXT_PUBLIC_USE_MOCKS: 'true'
      NEXT_PUBLIC_ENGINE_URL: http://localhost:8000
      NEXT_PUBLIC_ENGINE_WS: ws://localhost:8000/ws
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace=@sunshare/web

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Contract tests
        run: npm test --workspace=@sunshare/contracts

  engine:
    name: engine
    runs-on: ubuntu-latest
    env:
      # pydantic-core 2.27.2 ships no wheel for 3.13+, so the runtime is pinned
      # here for the same reason it is pinned on Render.
      WEATHER_MODE: synthetic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/engine/requirements.txt

      - run: pip install -r services/engine/requirements.txt

      - name: Engine tests
        run: python -m pytest
        working-directory: services/engine
